name: Publish crates

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

# Serialize releases, including retries, so publishing the shared dependency
# cannot race another release. An active release must finish before the next.
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate release tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/publish.py --check-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main

  test:
    needs: validate
    uses: ./.github/workflows/rust.yml

  publish:
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
          persist-credentials: false
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build
      - name: Install matching IREE compiler
        run: python -m pip install iree-base-compiler==3.13.0
      - name: Configure compiler library
        run: python tools/configure-compiler.py
      - name: Verify packages and publish in dependency order
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python tools/publish.py "$RELEASE_TAG"
