name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test release tooling
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install Windows native tools
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build
      - name: Install matching IREE compiler
        run: python -m pip install iree-base-compiler==3.13.0
      - name: Configure compiler library
        run: python tools/configure-compiler.py
      - name: Check formatting and fixture reproducibility
        run: |
          cargo fmt --all --check
          python tools/regenerate-fixtures.py --check
      - name: Test compiler and runtime
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --release --features half
      - name: Test runtime without compiler
        run: cargo test --locked --no-default-features --features std,runtime,half
      - name: Test Vulkan on software driver
        if: runner.os == 'Linux'
        env:
          EERIE_TEST_VULKAN: '1'
        run: |
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
          cargo test --locked --release --features vulkan integration_tests::vulkan_smoke
      - name: Check compiler without runtime and no_std runtime
        run: |
          cargo check --locked --no-default-features --features compiler
          cargo check --locked --no-default-features --features runtime
      - name: Build documentation without network access
        env:
          DOCS_RS: '1'
          CARGO_NET_OFFLINE: 'true'
        run: cargo doc --locked --workspace --no-default-features --features std,runtime,half --no-deps
      - name: Check packaged raw bindings
        run: cargo package --locked -p eerie-sys

  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install native dependencies
        # Newlib supplies C headers for the toolchain. The smoke test checks the
        # link map to ensure none of its runtime archives enter the executable.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - name: Build and run Cortex-M smoke test
        run: python3 tools/test-bare-metal.py
