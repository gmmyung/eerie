name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - name: Enable long Windows paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update pip
        run: python -m pip install --upgrade pip
      - name: Test release tooling
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Configure MSVC
        if: runner.os == 'Windows'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found' }
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Install Windows native tools
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build
      - name: Configure Windows native build
        if: runner.os == 'Windows'
        run: |
          $llvm = if ($env:LLVM_PATH) { $env:LLVM_PATH } else { 'C:\Program Files\LLVM' }
          "LIBCLANG_PATH=$llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CARGO_TARGET_DIR=C:\t' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check compiler build before installing its library
        run: cargo check --locked --no-default-features --features compiler
      - name: Install matching IREE compiler
        run: python -m pip install iree-base-compiler==3.13.0
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check fixture reproducibility
        run: python tools/regenerate-fixtures.py --check
      - name: Test compiler and runtime
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --release --features half
      - name: Test runtime without compiler
        run: cargo test --locked --no-default-features --features std,runtime,half
      - name: Test Windows static CRT
        if: runner.os == 'Windows'
        run: cargo test --locked --no-default-features --features std,runtime,half --test runtime --config 'build.rustflags=["-C", "target-feature=+crt-static"]'
      - name: Test Vulkan on software driver
        if: runner.os == 'Linux'
        env:
          EERIE_TEST_VULKAN: '1'
        run: |
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
          cargo test --locked --release --features vulkan integration_tests::vulkan_smoke
      - name: Check no_std runtime
        run: cargo check --locked --no-default-features --features runtime
      - name: Build documentation without network access
        env:
          DOCS_RS: '1'
          CARGO_NET_OFFLINE: 'true'
        run: cargo doc --locked --workspace --no-default-features --features std,runtime,compiler,half --no-deps
      - name: Check packaged raw bindings
        run: cargo package --locked -p eerie-sys

  bare-metal:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Install native dependencies
        # Newlib supplies C headers for the toolchain. The smoke test checks the
        # link map to ensure none of its runtime archives enter the executable.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      - name: Build and run Cortex-M smoke test
        run: python3 tools/test-bare-metal.py

  melior:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6.0.3
        with:
          submodules: true
      - name: Initialize runtime dependencies
        run: python3 tools/init-runtime-deps.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          install_options: --no-daemon
          # Hosted runners do not provide the namespaces Nix sandboxing needs.
          extra_nix_config: sandbox = false
      - name: Test Melior with a separate LLVM/MLIR build
        run: nix develop .#melior -c python tools/test-melior.py
