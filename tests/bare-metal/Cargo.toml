[package]
name = "eerie-bare-metal-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
eerie = { path = "../..", default-features = false, features = ["runtime"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
embedded-alloc = "0.6"
panic-semihosting = "0.6"

[profile.dev]
opt-level = "z"
panic = "abort"

[profile.release]
opt-level = "z"
panic = "abort"
