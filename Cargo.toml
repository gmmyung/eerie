[package]
name = "eerie"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Gyungmin Myung"]
description = "Rust bindings to the IREE compiler and runtime"
readme = "README.md"
repository = "https://github.com/gmmyung/eerie"

[package.metadata.docs.rs]
no-default-features = true
features = ["std", "runtime", "compiler", "half"]

[dependencies]
eerie-sys = { path = "eerie-sys", version = "0.5.0", default-features = false }
thiserror = { version = "2.0", optional = true }
log = { version = "0.4", optional = true }
half = { version = "2.7", default-features = false, optional = true }
critical-section = { version = "1.2", optional = true }

[workspace]
members = [
    "eerie-sys"
]

[target.'cfg(windows)'.dependencies]
libc = { version = "0.2", optional = true }
dunce = { version = "1.0", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
libm = { version = "0.2", default-features = false, optional = true }
tinyrlibc = { version = "0.5.1", default-features = false, features = [
    "abs",
    "alloc",
    "atoi",
    "isalpha",
    "isdigit",
    "isspace",
    "isupper",
    "memchr",
    "strcmp",
    "strlen",
    "strncmp",
    "strtoul",
], optional = true }

[dev-dependencies]
test-log = { version = "0.2" }
env_logger = "0.11"

[features]
default = ["runtime", "compiler", "std"]
runtime = ["eerie-sys/runtime", "dep:log", "dep:critical-section", "dep:libm", "dep:tinyrlibc"]
compiler = ["eerie-sys/compiler", "std", "dep:thiserror", "dep:log", "dep:libc", "dep:dunce"]
std = ["eerie-sys/std"]
half = ["dep:half"]
cuda = ["runtime", "eerie-sys/cuda"]
vulkan = ["runtime", "eerie-sys/vulkan"]
cross-lang-lto = ["runtime", "eerie-sys/cross-lang-lto"]

[[example]]
name = "resnet"
test = false
bench = true
